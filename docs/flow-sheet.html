<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Harness Template Flow Sheet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: an engineering drawing sheet. Zoned frame, lettered panels, title block in the last zone.
   Panel A (the flow) spans the sheet; reference panels tile below it. */
:root{
  --ground:#e8edf2; --paper:#fbfcfd; --ink:#131920; --line:#1a2129; --rule:#cfd7e0; --muted:#566271;
  --lane:#f0f3f7; --accent:#1c5bc3; --accent-soft:#e1eaf9; --warn:#bb3628; --warn-soft:#f9e5e1;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#090c10; --paper:#10151b; --ink:#e1e7ee; --line:#c2cbd5; --rule:#29323c; --muted:#8e9aaa;
    --lane:#141a21; --accent:#7aa9ff; --accent-soft:#172741; --warn:#ff8b7b; --warn-soft:#3a1d19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#090c10; --paper:#10151b; --ink:#e1e7ee; --line:#c2cbd5; --rule:#29323c; --muted:#8e9aaa;
  --lane:#141a21; --accent:#7aa9ff; --accent-soft:#172741; --warn:#ff8b7b; --warn-soft:#3a1d19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.mono{font-family:var(--f-mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header bar */
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.eyebrow{font:11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.top h1{margin:2px 0 0;font:600 26px/1.15 var(--f-cond);text-wrap:balance}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{border:0;background:var(--paper);padding:6px 11px;font:500 12.5px var(--f-sans);cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--paper)}
.chk{display:inline-flex;gap:7px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.chk.disabled{color:var(--muted);cursor:default}

/* Sheet frame with zone rulers */
.sheet{position:relative;background:var(--paper);border:1.5px solid var(--line);padding:22px}
.ruler{position:absolute;display:flex;font:10.5px var(--f-mono);color:var(--muted);pointer-events:none}
.ruler span{flex:1;display:grid;place-items:center}
.ruler.t,.ruler.b{left:22px;right:22px;height:22px}
.ruler.t{top:0}.ruler.b{bottom:0}
.ruler.t span+span,.ruler.b span+span{border-left:1px solid var(--line)}
.ruler.l,.ruler.r{top:22px;bottom:22px;width:22px;flex-direction:column}
.ruler.l{left:0}.ruler.r{right:0}
.ruler.l span+span,.ruler.r span+span{border-top:1px solid var(--line)}
.inner{border:1px solid var(--line);padding:20px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr);align-items:start}

/* Panels */
.panel{border:1.5px solid var(--line);background:var(--paper);min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:stretch;border-bottom:1px solid var(--line);min-height:40px}
.pl{flex:0 0 38px;display:grid;place-items:center;background:var(--line);color:var(--paper);font:600 16px var(--f-cond)}
.ph h2{margin:0;flex:1;padding:8px 12px;font:600 17px/1.25 var(--f-cond);align-self:center;text-wrap:balance}
.pm{padding:0 12px;align-self:center;font:11px var(--f-mono);color:var(--muted);text-align:right}
.pb{padding:14px 16px 16px;display:grid;gap:12px;min-width:0}
.lead{margin:0;max-width:78ch}
.note{margin:0;font-size:12.5px;color:var(--muted);max-width:90ch}
.sub{margin:4px 0 -4px;font:11px var(--f-mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

/* Tables */
.tw{overflow-x:auto;min-width:0}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:400 11px var(--f-mono);color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:var(--lane)}
.tbl td.k{font-weight:600;font-family:var(--f-cond);font-size:13.5px;white-space:nowrap}
.tbl td.m{font-family:var(--f-mono);font-size:12px}
.tbl td.c-on,.tbl tbody tr:nth-child(even) td.c-on{background:var(--accent-soft)}
.tbl th.c-on{color:var(--accent)}
.ph-chip{font:11px var(--f-mono);white-space:nowrap}
.tbl .num{display:none}
.ph-chip.late{color:var(--muted)}

/* Flow panel */
.pa-top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.flow-wrap{overflow-x:auto;border:1px solid var(--rule);background:var(--paper)}
#flow{display:block;width:100%;min-width:1240px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.lg-box{width:18px;height:11px;border:1.3px solid var(--ink);display:inline-block}
.lg-box.d{border-style:dashed}
.lg-box.f{opacity:.25}
.lg-no{width:16px;height:16px;border-radius:50%;background:var(--line);color:var(--paper);font:500 9.5px/16px var(--f-mono);text-align:center;display:inline-block}
.player{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border:1px solid var(--line);padding:8px 10px;background:var(--lane)}
.pbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{font:500 13px var(--f-sans);border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--line);color:var(--paper);min-width:86px;justify-content:center}
.btn svg{width:12px;height:12px;fill:currentColor}
.cap{margin:0;flex:1 1 360px;min-width:0;font-size:13.5px}
.cap .k{font:11px var(--f-mono);color:var(--muted);margin-right:8px;white-space:nowrap}
.cap .w{display:block;font-size:12px;color:var(--warn)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.st button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 10px;width:100%;height:100%;align-content:start;padding:10px 12px;border:1px solid var(--rule);background:var(--paper);cursor:pointer}
.st button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.st button:hover{border-color:var(--line)}
.st.on button{border-color:var(--accent);background:var(--accent-soft)}
.st .no{grid-row:1 / span 3;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--paper);font:500 11px/22px var(--f-mono);text-align:center}
.st.on .no{background:var(--accent)}
.st .ac{font:10.5px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.st .tt{font:600 14px/1.3 var(--f-cond)}
.st .tx{font-size:13px}
.st.quiet .tt,.st.quiet .tx{color:var(--muted)}

/* SVG flow */
#flow .lane{fill:var(--paper)} #flow .lane.alt{fill:var(--lane)}
#flow .lb{stroke:var(--rule);stroke-width:1}
#flow .lcol{stroke:var(--line);stroke-width:1}
#flow .ln1{font:600 13px var(--f-cond);fill:var(--ink)}
#flow .ln2{font:10.5px var(--f-mono);fill:var(--muted)}
#flow .nb{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
#flow .node.dash .nb{stroke-dasharray:5 4}
#flow .nt1{font:600 12.5px var(--f-cond);fill:var(--ink)}
#flow .nt2{font:10.5px var(--f-mono);fill:var(--muted)}
#flow .ep{fill:none;stroke:var(--ink);stroke-width:1.2}
#flow .edge.dash .ep{stroke-dasharray:5 4}
#flow .el{font:10.5px var(--f-mono);fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
#flow .ft{font:10.5px var(--f-mono);fill:var(--muted)}
#flow .jd{fill:var(--ink)}
#flow .mk{fill:var(--ink)} #flow .mk-on{fill:var(--accent)}
#flow .bdg circle{fill:var(--line)}
#flow .bdg text{font:500 10px var(--f-mono);fill:var(--paper)}
#flow .node.on .nb{stroke:var(--accent);stroke-width:2;fill:var(--accent-soft)}
#flow .node.on .bdg circle{fill:var(--accent)}
#flow .edge.on .ep{stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5;animation:march .9s linear infinite}
#flow .edge.on .el,#flow .ft.on{fill:var(--accent)}
#flow .edge.on .jd{fill:var(--accent)}
#flow .dim{opacity:.36}
#flow .off{opacity:.15}
@keyframes march{to{stroke-dashoffset:-12}}

/* Rule figure, gauge */
.fig{margin:0;display:grid;gap:6px}
.fig > svg{display:block;width:100%;height:auto;max-width:560px}
.fig figcaption{font-size:12px;color:var(--muted)}
.fig .ax{stroke:var(--ink);stroke-width:1}
.fig .gl{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.fig .tk{font:10.5px var(--f-mono);fill:var(--muted)}
.fig .lb{font:600 12.5px var(--f-cond);fill:var(--ink)}
.fig .i-pass{stroke:var(--accent);fill:var(--accent)}
.fig .i-inc{stroke:var(--muted);fill:var(--muted)}
.fig .i-fail{stroke:var(--warn);fill:var(--warn)}
.fig .iv{stroke-width:2.2}
.fig .band{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.fig .bar{fill:var(--accent)} .fig .bar.over{fill:var(--warn)}
.fig .tg{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}
.fig .vl{font:500 11px var(--f-mono);fill:var(--ink)}
.formula{font:13px var(--f-mono);padding:10px 12px;border:1px solid var(--rule);background:var(--lane);overflow-x:auto;white-space:nowrap}
.defs{margin:0;padding-left:18px;font-size:13px;display:grid;gap:3px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.rules b{font-family:var(--f-cond);font-weight:600}

/* Calculator */
.calc{display:grid;gap:9px}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,140px) 42px;gap:10px;align-items:center;font-size:13px}
.crow label{min-width:0}
.crow output{font:500 13px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line)}
.kpi{padding:8px 10px;border-left:1px solid var(--rule);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font:10.5px var(--f-mono);color:var(--muted)}
.kpi .v{font:600 22px/1.2 var(--f-cond);font-variant-numeric:tabular-nums}
.verdict{margin:0;font-size:13px;padding:7px 10px;border:1px solid var(--accent);background:var(--accent-soft)}
.verdict.over{border-color:var(--warn);background:var(--warn-soft)}
.cost{margin:0;font:12px var(--f-mono);color:var(--muted)}
.kpi .v.over{color:var(--warn)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.presets .sub{margin:0 4px 0 0}
.presets .btn[aria-pressed="true"]{background:var(--line);color:var(--paper)}
.fig .dot-ok{fill:var(--accent)} .fig .dot-low{fill:var(--warn)} .fig .dot-mean{fill:var(--ink)}
.fig .stem{stroke:var(--rule);stroke-width:1.5}
.fig .zone{fill:var(--warn-soft)}
.fig .rbar{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.fig .rbar.over{fill:var(--warn-soft);stroke:var(--warn)}

/* Guard layers */
.layers{list-style:none;margin:0;padding:0;border:1px solid var(--line)}
.layers li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:3px 10px;padding:9px 12px;border-top:1px solid var(--rule)}
.layers li:first-child{border-top:0}
.ly-n{font:500 12px/20px var(--f-mono)}
.ly-t{font:600 14px/20px var(--f-cond)}
.ly-x{grid-column:2 / -1;font-size:13px}
.tag{font:10.5px var(--f-mono);padding:1px 6px;border:1px solid currentColor;align-self:start;white-space:nowrap}
.tag.auth{color:var(--accent)} .tag.loc{color:var(--muted)}
.tag.ok{color:var(--accent)} .tag.part{color:var(--ink)} .tag.stop{color:var(--warn)} .tag.no{color:var(--muted);border-style:dashed}
.ly-c{display:inline-block;max-width:100%;font:400 11.5px var(--f-mono);color:var(--muted);margin-left:6px}
#roomFig .tk{font-size:11.5px} #roomFig .vl{font-size:12px} #roomFig .lb{font-size:13px}

/* Encode, verify, retro strip */
.evr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.evr > div{padding:8px 10px;border-left:1px solid var(--rule);min-width:0;display:grid;gap:4px;align-content:start}
.evr > div:first-child{border-left:0}
.evr .l{font:10.5px var(--f-mono);color:var(--muted)}
.evr .n{font:600 14px/1.3 var(--f-cond);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.evr .x{font-size:12.5px}

/* Code layers */
.lyrs{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.lyrs li{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 12px;border:1px solid var(--line);background:var(--paper)}
.lyrs li + li::before{content:attr(data-arrow);position:absolute;top:-20px;left:12px;font:10.5px/18px var(--f-mono);color:var(--muted)}
.ly-nm{font:600 14px/20px var(--f-mono);min-width:0}
.ly-f{font:400 11px var(--f-mono);color:var(--muted);margin-left:6px}
.lyrs .ly-x{grid-column:1 / -1;font-size:13px}
.ly-b{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font:10.5px var(--f-mono);color:var(--muted)}
.ly-b i{display:block;flex:0 0 auto;height:6px;background:var(--accent);min-width:2px}
.ly-b span{white-space:nowrap}
.lyrs li.none .ly-b i{background:var(--muted)}

/* Phases */
.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0 12px;position:relative}
.phases::before{content:"";position:absolute;left:4%;right:4%;top:31px;border-top:1px solid var(--line)}
.phi{position:relative;display:grid;gap:4px;justify-items:center;text-align:center;align-content:start}
.ph-y{font:600 15px/22px var(--f-cond)}
.ph-d{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper)}
.ph-n{font:600 13px/1.3 var(--f-cond);margin-top:4px}
.ph-g{font-size:12px;color:var(--muted)}
.ph-s{font-size:11.5px;color:var(--muted);display:grid;gap:3px;justify-items:center;margin-top:2px}
.ph-d.ok{background:var(--line)}
.ph-d.part{background:linear-gradient(90deg,var(--line) 50%,var(--paper) 50%)}

/* Title block */
.tb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1.5px solid var(--line);background:var(--paper);min-width:0}
.tb .f{padding:6px 10px;border-top:1px solid var(--line);min-width:0}
.tb .f.r{border-left:1px solid var(--line)}
.tb .f.w{grid-column:1 / -1}
.tb .f:first-child{border-top:0}
.tb .k{font:10.5px var(--f-mono);color:var(--muted)}
.tb .v{font:500 14px/1.35 var(--f-cond);overflow-wrap:anywhere}
.tb .title .v{font:600 19px/1.25 var(--f-cond)}
.tb a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}

/* STE word counts */
.ste-s{display:inline}
.wcb{font:500 9.5px var(--f-mono);color:var(--accent);margin-left:2px;vertical-align:super;line-height:0}
.wcb.over{color:var(--warn)}

/* Responsive */
@media (max-width:899px){
  .sheet{padding:0;border:0;background:transparent}
  .ruler{display:none}
  .inner{border:0;padding:0;gap:16px}
  .flow-wrap,.legend{display:none}
  .phases{grid-template-columns:minmax(0,1fr);gap:12px}
  .phases::before{left:5px;right:auto;top:8px;bottom:8px;border-top:0;border-left:1px solid var(--line)}
  .phi{grid-template-columns:11px minmax(0,1fr);justify-items:start;text-align:left;gap:0 12px}
  .ph-d{grid-row:1;grid-column:1;margin-top:5px}
  .ph-y{grid-column:2;line-height:20px}
  .ph-n,.ph-g{grid-column:2;margin:0}
  .ph-s{grid-column:2;justify-items:start;text-align:left}
}
@media (min-width:900px){
  .inner{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pA,.pB,.pC,.pD,.pG,.pH,.pI,.pJ,.pT{grid-column:1 / -1}
}
@media (min-width:1260px){
  .inner{grid-template-columns:repeat(12,minmax(0,1fr))}
  .pA{grid-column:1 / -1}
  .pB{grid-column:span 5}.pC{grid-column:span 7}
  .pD{grid-column:span 7}.pE{grid-column:span 5}
  .pF{grid-column:span 5}.pG{grid-column:span 7}
  .pH{grid-column:span 7}.pI{grid-column:span 5}
  .pJ{grid-column:span 8}.pT{grid-column:span 4}
}
@media (max-width:640px){
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody{display:block;width:100%}
  .tbl.stack tr{display:block;padding:8px 0;border-bottom:1px solid var(--rule)}
  .tbl.stack td{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;border:0;padding:2px 0;white-space:normal}
  .tbl.stack tbody tr td,.tbl.stack tbody tr:nth-child(even) td{background:none}
  .tbl.stack td::before{content:attr(data-label);font:10.5px/1.9 var(--f-mono);color:var(--muted)}
  .tbl.stack td.k{display:block;font-size:14.5px;padding-bottom:4px}
  .tbl.stack td.k::before{content:none}
  .tbl.stack .num{display:inline-block;font:500 12px var(--f-mono);color:var(--muted);margin-right:8px}
  #tblRules.stack td:first-child{display:none}
  .evr{grid-template-columns:minmax(0,1fr)}
  .evr > div{border-left:0;border-top:1px solid var(--rule)}
  .evr > div:first-child{border-top:0}
}
@media (max-width:480px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--rule)}
  .kpi .v{font-size:19px}
  .crow{grid-template-columns:minmax(0,1fr) 96px 38px}
}
@media (prefers-reduced-motion:reduce){
  #flow .edge.on .ep{animation:none;stroke-dasharray:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-k="ui.eyebrow"></div>
      <h1 data-k="ui.h1"></h1>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" id="langseg" aria-label="Language">
        <button type="button" id="lang-en" aria-pressed="true">EN · STE</button>
        <button type="button" id="lang-vi" aria-pressed="false">Tiếng Việt</button>
      </div>
      <label class="chk" id="wc-wrap"><input type="checkbox" id="wc"> <span data-k="ui.wc"></span></label>
    </div>
  </header>

  <div class="sheet">

 "pE.defs":{en:["gate: 1 if build and typecheck pass, 0 if not.","S_det: hidden tests, lint, bundle size and load time, from 0 to 1. A part with no measurement drops out, and the weights of the other parts scale up.","S_rub: a weighted rubric that the LLM judge scores. Start weights: 0.5 and 0.5.","Example, c4 (T9): hidden tests 17 of 17, lint passes, the judge fails the criterion tests. Score: 90."],
            vi:["gate: 1 nếu build và typecheck pass, 0 nếu không.","S_det: test ẩn, lint, bundle size và load time, từ 0 tới 1. Phần không đo thì bỏ ra, và trọng số của các phần còn lại tự chia lại.","S_rub: rubric có trọng số do LLM judge chấm. Trọng số khởi điểm: 0.5 và 0.5.","Ví dụ c4 (T9): test ẩn 17/17, lint pass, judge fail tiêu chí tests. Score: 90."]},

            vi:[["Script","gate, S_det","Cùng input, cùng kết quả"],["LLM judge","S_rub","Một lần gọi, không tool, model khác"],["Thức","calibrate, settle","Judge phải đạt κ ≥ 0.6 và 8/10 cặp. Chưa calibrate"]]},

/* ---------- MDE80 simulation (panel F) ---------- */
var TQ = [3.07768,1.88562,1.63774,1.53321,1.47588,1.43976,1.41492,1.39682,1.38303,1.37218,1.36343,1.35622,1.35017,1.34503,1.34061,1.33676,1.33338,1.33039,1.32773,1.32534,1.32319,1.32124,1.31946,1.31784,1.31635,1.31497,1.3137,1.31253,1.31143,1.31042];
var NSIM = 20000, SIM = {};
function rng(seed){ return function(){ seed = (seed + 0x6D2B79F5)|0; var x = Math.imul(seed ^ (seed>>>15), 1|seed); x = (x + Math.imul(x ^ (x>>>7), 61|x)) ^ x; return ((x ^ (x>>>14))>>>0)/4294967296; }; }
function sims(n){
  if(SIM[n]) return SIM[n];
  var r = rng(9137 + n*101), zb = new Float64Array(NSIM), sz = new Float64Array(NSIM), spare = null;
  function z(){ if(spare!==null){ var s=spare; spare=null; return s; } var u=0,v=0; while(u===0) u=r(); v=r(); var m=Math.sqrt(-2*Math.log(u)); spare = m*Math.sin(2*Math.PI*v); return m*Math.cos(2*Math.PI*v); }
  for(var i=0;i<NSIM;i++){
    var s1=0, s2=0;
    for(var j=0;j<n;j++){ var x=z(); s1+=x; s2+=x*x; }
    var mean = s1/n;
    zb[i] = mean; sz[i] = Math.sqrt(Math.max(0,(s2 - n*mean*mean)/(n-1)));
  }
  return (SIM[n] = {zb:zb, sz:sz});
}
function thresholds(n, sd, dmin){
  var p = sims(n), tq = TQ[n-2], q = Math.sqrt(n), out = new Float64Array(NSIM);
  for(var i=0;i<NSIM;i++){
    var a = sd*(tq*p.sz[i]/q - p.zb[i]);
    var b = dmin - sd*p.zb[i];
    out[i] = a>b ? a : b;
  }
  out.sort();
  return out;
}
function frac(sorted, v){ var lo=0, hi=sorted.length; while(lo<hi){ var mid=(lo+hi)>>1; if(sorted[mid]<v) lo=mid+1; else hi=mid; } return lo/sorted.length; }
function val(id){ return parseFloat(document.getElementById(id).value); }
function fmt(v,d){ return v.toFixed(d); }
var PRESETS = {
  t18:{"c-n":5, "c-m":3, "c-sr":4.7, "c-si":5, "c-dm":3, "c-dt":8, "c-h0":94.8},
  plan:{"c-n":12, "c-m":3, "c-sr":10, "c-si":5, "c-dm":3, "c-dt":8, "c-h0":60}
};
function setPreset(p){
  var v = PRESETS[p]; if(!v) return;
  Object.keys(v).forEach(function(id){ document.getElementById(id).value = v[id]; });
  calc();
}
function markPresets(){
  var bs = document.querySelectorAll("#presets button[data-preset]");
  for(var i=0;i<bs.length;i++){
    var v = PRESETS[bs[i].getAttribute("data-preset")];

}
function calc(){
  var n=val("c-n"), m=val("c-m"), sr=val("c-sr"), si=val("c-si"), dm=val("c-dm"), dt=val("c-dt"), h0=val("c-h0");

  document.getElementById("o-h0").textContent = fmt(h0,1);
  var sd = Math.sqrt(si*si + 2*sr*sr/m);
  var th = thresholds(n, sd, dm);
  var mde = th[Math.floor(0.8*NSIM)];
  var room = Math.max(0, 100 - h0);
  var gain = Math.min(4, room);
  var pp = gain > 0 ? frac(th, gain) : 0;
  var low = room <= mde;
  document.getElementById("v-sd").textContent = fmt(sd,1);

  document.getElementById("cost").textContent = t("v.cost").replace("{r}", n*m*10).replace("{s}", n*m*6).replace("{j}", n*m*4);
  // gauge: paper band, MDE80 bar, room bar, δ_target line
  var X = function(v){ return 16 + Math.min(v,20)*18; };

  g += '<line class="ax" x1="16" x2="376" y1="92" y2="92"/>';
  [0,5,10,15,20].forEach(function(v){ g += '<line class="ax" x1="'+X(v)+'" x2="'+X(v)+'" y1="92" y2="96"/><text class="tk" x="'+X(v)+'" y="108" text-anchor="middle">'+v+'</text>'; });
  g += '<text class="tk" x="'+X(dt)+'" y="120" text-anchor="middle">'+esc(t("g.target"))+' '+fmt(dt,1)+'</text>';
  var gs = document.getElementById("gauge");
  gs.innerHTML = g;

/* ---------- Player ---------- */
var timer = null, uttId = 0;
function canSpeak(){ return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"; }
function pickVoice(){
  if(!canSpeak()) return null;
  var vs = window.speechSynthesis.getVoices() || [], pre = S.lang==="vi" ? "vi" : "en";
  for(var i=0;i<vs.length;i++){ if((vs[i].lang||"").toLowerCase().indexOf(pre)===0) return vs[i]; }
  return null;
}
function dur(text){ return Math.max(3800, nwords(text)*360 + 1400); }
function stopSpeech(){ uttId++; try{ if(canSpeak()) window.speechSynthesis.cancel(); }catch(e){} }
function cue(){
  clearTimeout(timer); stopSpeech();
  if(!S.playing) return;
  var s = stepAt(S.step), text = s.t + ". " + s.x;
  var v = S.voice ? pickVoice() : null;
  if(S.voice && v){
    var my = ++uttId;
    var u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = 1;
    u.onend = function(){ if(my===uttId && S.playing) advance(); };
    u.onerror = function(){ if(my===uttId && S.playing){ timer = setTimeout(advance, dur(text)); } };
    try{ window.speechSynthesis.speak(u); }catch(e){ timer = setTimeout(advance, dur(text)); }
  } else {
    timer = setTimeout(advance, dur(text));
  }
}
function advance(){
  if(S.step < STEPS.length-1){ S.step++; renderFlowParts(); keepVisible(); cue(); }
  else { S.playing = false; renderFlowParts(); }
}
function keepVisible(){
  if(window.matchMedia("(max-width: 899px)").matches){
    var li = document.querySelector(".st.on");
    if(li && li.scrollIntoView) li.scrollIntoView({block:"nearest", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }
}
function setVoiceNote(){
  NOTE = "";
  if(S.voice && (!canSpeak() || !pickVoice())) NOTE = t("cap.novoice");
}
function go(i){ S.step = Math.max(0, Math.min(STEPS.length-1, i)); renderFlowParts(); if(S.playing) cue(); }

document.getElementById("play").addEventListener("click", function(){
  if(S.playing){ S.playing=false; clearTimeout(timer); stopSpeech(); renderFlowParts(); return; }
  S.playing = true;
  if(S.step<0 || S.step>=STEPS.length-1) S.step = 0;
  setVoiceNote(); renderFlowParts(); cue();
});
document.getElementById("prev").addEventListener("click", function(){ go(S.step<0 ? 0 : S.step-1); });
document.getElementById("next").addEventListener("click", function(){ go(S.step+1); });
document.getElementById("voice").addEventListener("change", function(e){
  S.voice = e.target.checked; setVoiceNote(); buildCaption(NOTE); if(S.playing) cue();
});
document.getElementById("steps").addEventListener("click", function(e){
  var b = e.target.closest("button[data-i]"); if(!b) return;
  go(parseInt(b.getAttribute("data-i"),10));
});
document.getElementById("modeseg").addEventListener("click", function(e){
  var b = e.target.closest("button[data-mode]"); if(!b) return;
  S.mode = b.getAttribute("data-mode");
  buildStatic(); buildTables(); renderFlowParts(); if(S.playing) cue();
});
function setLang(l){
  S.lang = l; try{ localStorage.setItem("hfs.lang", l); }catch(e){}
  setVoiceNote(); renderAll(); if(S.playing) cue();
}
document.getElementById("lang-en").addEventListener("click", function(){ setLang("en"); });
document.getElementById("lang-vi").addEventListener("click", function(){ setLang("vi"); });
document.getElementById("wc").addEventListener("change", function(e){
  S.wc = e.target.checked; try{ localStorage.setItem("hfs.wc", S.wc?"1":"0"); }catch(err){}
  renderAll();
});
["c-n","c-m","c-sr","c-si","c-dm","c-dt","c-h0"].forEach(function(id){ document.getElementById(id).addEventListener("input", calc); });
document.getElementById("presets").addEventListener("click", function(e){
  var b = e.target.closest("button[data-preset]"); if(!b) return;
  setPreset(b.getAttribute("data-preset"));
});
if(canSpeak()){ try{ window.speechSynthesis.addEventListener("voiceschanged", function(){ if(S.voice){ setVoiceNote(); buildCaption(NOTE); } }); }catch(e){} }

renderAll();
})();
</script>

</body>
</html>
